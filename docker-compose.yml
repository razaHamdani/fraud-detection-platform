services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fraud_detection
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fraud_pass}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_detection"]
      interval: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-fraud_pass}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-fraud_pass}", "RETURN 1"]
      interval: 10s
      retries: 5

  stream-ingester:
    build:
      context: .
      dockerfile: services/stream-ingester/Dockerfile
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgresql://fraud_user:${POSTGRES_PASSWORD:-fraud_pass}@postgres:5432/fraud_detection
    depends_on:
      redis:
        condition: service_healthy

  feature-engine:
    build:
      context: .
      dockerfile: services/feature-engine/Dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgresql://fraud_user:${POSTGRES_PASSWORD:-fraud_pass}@postgres:5432/fraud_detection
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-fraud_pass}
    depends_on:
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  risk-scorer:
    build:
      context: .
      dockerfile: services/risk-scorer/Dockerfile
    ports:
      - "8003:8003"
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgresql://fraud_user:${POSTGRES_PASSWORD:-fraud_pass}@postgres:5432/fraud_detection
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  decision-api:
    build:
      context: .
      dockerfile: services/decision-api/Dockerfile
    ports:
      - "8004:8004"
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgresql://fraud_user:${POSTGRES_PASSWORD:-fraud_pass}@postgres:5432/fraud_detection
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  feedback-service:
    build:
      context: .
      dockerfile: services/feedback-service/Dockerfile
    ports:
      - "8005:8005"
    environment:
      REDIS_URL: redis://redis:6379
      POSTGRES_DSN: postgresql://fraud_user:${POSTGRES_PASSWORD:-fraud_pass}@postgres:5432/fraud_detection
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  neo4jdata:
