[project]
name = "decision-api"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fraud-shared",
    "asyncpg>=0.29,<1",
    "fastapi>=0.109,<1",
    "redis>=5.0,<6",
    "structlog>=24.1,<25",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.26,<1",
    "ruff>=0.2,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
