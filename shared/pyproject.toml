[project]
name = "fraud-shared"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "redis>=5.0,<6",
    "asyncpg>=0.29,<1",
    "neo4j>=5.14,<6",
    "structlog>=24.1,<25",
    "httpx>=0.26,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.2,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
